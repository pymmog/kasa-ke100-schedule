[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ke100-schedule"
version = "0.1.0"
description = "Read and write TP-Link Tapo KE100 Smart Control heating schedules via a KH100 hub using python-kasa"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "pymmog" }]
keywords = ["tapo", "ke100", "kh100", "kasa", "thermostat", "schedule"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "python-kasa>=0.10,<0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
ke100-schedule = "ke100_schedule.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ke100_schedule"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
